<div class="col-lg-12">
  <div *ngIf="isLoading"
       style="position: fixed; width: 100%; height: 100%; display: flex ; justify-content: center; align-items: center; background: white; top: 0; left: 0 ; z-index:  9999;  margin-top: 7%; border-radius: 5%; ">
    <mat-spinner></mat-spinner>
  </div>

  <mat-card class="mat-card cardWithShadow">
    <form [formGroup]="searchForm" (submit)="filterData(searchForm.value)">
      <mat-card-content class="mat-mdc-card-content">
        <div class="row justify-content-evenly"
             style="display: flex; align-items: center; justify-content: space-evenly">

          <div class="col-3 m-0 p-0">
            <mat-form-field appearance="outline" class="form-field-class col-12">
              <mat-label class="mat-label-class">Prenom</mat-label>
              <input formControlName="firstName" class="mat-input-class" matInput placeholder="Entrez le Prenom...">
            </mat-form-field>
          </div>
          <br>
          <div class="col-3 m-0 p-0">
            <mat-form-field appearance="outline" class="form-field-class col-12">
              <mat-label class="mat-label-class">Nom</mat-label>
              <input formControlName="lastName" class="mat-input-class" matInput
                     placeholder="Entrez le Nom..."></mat-form-field>
          </div>
          <br>
          <div class="col-3 m-0 p-0">
            <mat-form-field appearance="outline" class="form-field-class col-12">
              <mat-label class="mat-label-class">Adresse</mat-label>
              <input formControlName="address" class="mat-input-class" matInput placeholder="Entrez l'adresse...">
            </mat-form-field>
          </div>
          <br>
          <div class="col-sm-4 text-end d-flex align-items-center justify-content-end"><br>
            <button mat-flat-button color="primary" class="add-contact-button-class col-12"> Rechercher</button>
          </div>
        </div>
      </mat-card-content>
    </form>
  </mat-card>
  <mat-card class="cardWithShadow">
    <mat-card-content class="p-24">
      <mat-card-title>Liste des Etudiants</mat-card-title>
      <div class="table-responsive m-t-16">
        <table mat-table [dataSource]="dataSource" class="w-100 table-borderless">
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Prenom</th>
            <td mat-cell *matCellDef="let element">
              <div class="d-flex align-items-center">
                <div class="m-l-16"><span class="mat-body-1 f-s-14">{{ element.firstName }}</span></div>
              </div>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Nom</th>
            <td mat-cell *matCellDef="let element">
              <div class="d-flex align-items-center">
                <div class="m-l-16"><span class="mat-body-1 f-s-14">{{ element.lastName }}</span></div>
              </div>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Adresse</th>
            <td mat-cell *matCellDef="let element">
              <div class="d-flex align-items-center">
                <div class="m-l-16"><span class="mat-body-1 f-s-14">{{ element.address }}</span></div>
              </div>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="primary" (click)="viewDetails(element)">
                <mat-icon>visibility</mat-icon>
              </button>
            </td>
          </ng-container>
          
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator [length]="100" [pageSize]="5" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
  
</div>
